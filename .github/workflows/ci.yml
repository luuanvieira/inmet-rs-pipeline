name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  testes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar dependências
        run: pip install -e ".[transformacao,dev]"

      - name: Lint
        run: ruff check src tests scripts

      - name: Testes unitários
        run: pytest -q

      - name: Dados de exemplo continuam iguais ao gerador
        run: |
          python scripts/gerar_dados_exemplo.py tests/fixtures
          git diff --exit-code tests/fixtures

      - name: Pipeline + dbt build com dados de exemplo
        run: make demo

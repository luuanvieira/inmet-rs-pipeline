[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "inmet-pipeline"
version = "0.1.0"
description = "Pipeline de dados meteorológicos do INMET para o Rio Grande do Sul (Python + DuckDB + dbt)"
readme = "README.md"
requires-python = ">=3.11,<3.13"
authors = [{ name = "Luan Vieira" }]
dependencies = [
    "duckdb>=1.1,<2",
    "pandas>=2.2,<3",
    "requests>=2.32,<3",
]

[project.optional-dependencies]
transformacao = ["dbt-duckdb>=1.8,<2"]
dashboard = ["streamlit>=1.38,<2"]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
inmet-pipeline = "inmet_pipeline.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
